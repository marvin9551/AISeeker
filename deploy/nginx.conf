# AISeeker 部署用 Nginx 配置模板
#
# 使用方法：
#   1. 把 docs/.vitepress/dist/ 里的内容上传到服务器 /var/www/aiseeker/
#   2. 复制本文件到 /etc/nginx/conf.d/aiseeker.conf（或 sites-available 并软链）
#   3. 把下方 aiseeker.example.com 换成你的域名，证书路径换成实际路径
#   4. 执行 nginx -t 检查配置，再 nginx -s reload

# HTTP 强制跳转 HTTPS
server {
    listen 80;
    server_name aiseeker.example.com;

    # 需要 HTTPS 证书时放开下面这行；只做临时访问可注释掉
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name aiseeker.example.com;

    # 证书路径（证书已就绪时填实际路径）
    ssl_certificate     /etc/nginx/ssl/aiseeker.example.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/aiseeker.example.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    root /var/www/aiseeker;
    index index.html;

    # 压缩文本类资源
    gzip on;
    gzip_min_length 1k;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;

    # 静态站点路由：VitePress 已生成 /foo.html 和 /foo/ 两种形式，直接按文件找即可
    location / {
        try_files $uri $uri/ =404;
    }

    # 带 hash 的静态资源可长期缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|webp|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
